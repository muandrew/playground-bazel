<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Compose Multiplatform Web - Shared Material 3 Button</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #root {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: fixed;
            top: 24px;
            left: 24px;
            right: 24px;
            z-index: 1;
            padding: 16px;
            border-radius: 8px;
            background: #252525;
            white-space: pre-wrap;
        }
        #loading[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root" data-compose-state="loading"></div>
    <div id="loading" role="status">Loading Compose Multiplatform…</div>
    <noscript>This example needs JavaScript and WebAssembly enabled.</noscript>
    <script type="importmap">
    {
        "imports": {
            "@js-joda/core": "./node_modules/@js-joda/core/dist/js-joda.esm.js"
        }
    }
    </script>
    <script type="module">
        // Import and asynchronous runtime failures must be visible even if no canvas renders.
        const loading = document.getElementById("loading");
        const root = document.getElementById("root");
        function showError(error) {
            console.error("Compose application failed to start:", error);
            root.dataset.composeState = "error";
            loading.hidden = false;
            loading.setAttribute("role", "alert");
            loading.textContent = "Unable to start Compose Multiplatform.\n" +
                (error?.stack || error?.message || String(error));
        }
        window.addEventListener("error", event => showError(event.error || event.message));
        window.addEventListener("unhandledrejection", event => showError(event.reason));
        import("./web_app.mjs").catch(showError);
    </script>
</body>
</html>
