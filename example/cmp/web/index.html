<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Multiplatform Web - Shared Button</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .counter-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #333333;
            text-align: center;
        }
        .counter-title {
            font-size: 24px;
            margin-bottom: 8px;
            color: #bb86fc;
        }
        .counter-subtitle {
            color: #888888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .shared-counter-btn {
            background: #bb86fc;
            color: #000000;
            border: none;
            border-radius: 24px;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(187, 134, 252, 0.35);
        }
        .shared-counter-btn:hover {
            background: #d7b7fd;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(187, 134, 252, 0.45);
        }
        .shared-counter-btn:active {
            transform: translateY(0);
        }
        .counter-status {
            color: #aaaaaa;
            font-size: 14px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Rendered dynamically by Compose Web Composition -->
    </div>
    <script type="application/javascript" src="web_app.js"></script>
</body>
</html>
