<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Compose Multiplatform Bottom Sheet Demo</title>
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
        }
        #root > canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: fixed;
            inset: 24px 24px auto;
            z-index: 1;
            padding: 16px;
            border-radius: 8px;
            background: #252525;
            color: white;
            font: 14px/1.5 system-ui, sans-serif;
            white-space: pre-wrap;
        }
        #loading[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="root" data-compose-state="loading"></div>
    <div id="loading" role="status">Loading Compose Multiplatform…</div>
    <noscript>This example needs JavaScript and WebAssembly enabled.</noscript>
    <script type="importmap">
    {
        "imports": {
            "@js-joda/core": "./node_modules/@js-joda/core/dist/js-joda.esm.js"
        }
    }
    </script>
    <script type="module">
        const loading = document.getElementById("loading");
        const root = document.getElementById("root");
        function showError(error) {
            console.error("Compose application failed to start:", error);
            root.dataset.composeState = "error";
            loading.hidden = false;
            loading.setAttribute("role", "alert");
            loading.textContent = "Unable to start Compose Multiplatform.\n" +
                (error?.stack || error?.message || String(error));
        }
        window.addEventListener("error", event => showError(event.error || event.message));
        window.addEventListener("unhandledrejection", event => showError(event.reason));
        import("./bs_app.mjs").catch(showError);
    </script>
</body>
</html>
