<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compose Multiplatform — Bottom Sheet Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive device frame for desktop preview */
        #app-viewport {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 880px;
            background-color: #121212;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        }

        @media (min-width: 500px) and (min-height: 700px) {
            #app-viewport {
                border-radius: 36px;
                border: 3px solid #2a2a2a;
                height: calc(100% - 40px);
            }
        }

        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="app-viewport">
        <div id="ComposeTarget"></div>
    </div>
    <script type="application/javascript" src="playground_bazel.js"></script>
</body>
</html>
